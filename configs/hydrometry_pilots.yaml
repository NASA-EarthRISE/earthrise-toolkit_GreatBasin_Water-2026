schema_version: hydrometry-pilots-v1

# Pinned Phase 1 manager-product settings.  These dates are deliberate
# reproducibility bounds; the workflow never substitutes the execution date.
phase1:
  history_start: "2016-01-01"
  analysis_end: "2026-08-13"
  change_windows_days:
    - 7
    - 30
    - 90
    - 365
  baseline_match_tolerance_days: 3
  seasonal_window_days: 15
  seasonal_min_distinct_years: 5
  seasonal_min_observations: 20
  freshness_warning_days: 7
  capacity_interpolation:
    method: piecewise_linear
    allow_extrapolation: false

# Bear Lake-only Phase 2 quantitative topobathymetry prototype. Source file
# identities remain configuration, not implicit filename guesses in code.
phase2:
  bear_lake:
    profile_id: bear_lake
    sciencebase_item_id: "698226f4b66b018d00102e42"
    raster_archive_name: Bear_Lake_TBDEM_2026_50cm.zip
    spatial_metadata_archive_name: Bear_Lake_TBDEM_2026_Spatial_Metadata.zip
    fgdc_metadata_name: Half-meter topobathymetric elevation model and elevation-area-volume tables for Bear Lake, Utah and Idaho, 2002-2018.xml
    thumbnail_name: Bear_Lake_TBDEM_2026_thumbnail.png
    candidate_spatial_resolutions_m:
      - 5
      - 10
      - 30
    validation_grid_steps: 150
    connectivity: 8
    selected_state_count: 5
    animation_frame_count: 18
    trusted_seed:
      crs: EPSG:4326
      longitude: -111.3321022385
      latitude: 41.9843783855
      description: Curated interior seed at the official ScienceBase representational point; must be numerically verified in the source raster.
    resampling:
      quantitative: average
      comparison: bilinear
      # Quantitative cells require complete source coverage; partial cells may
      # be used only on the separate rendering grid.
      minimum_valid_fraction: 1.0
      rendering_resolution_m: 60
    interactive_html:
      enabled: true
      maximum_file_size_mb: 50
    outputs:
      data_dir: data/hydrometry/phase2/bear_lake
      figure_dir: outputs/hydrometry_phase2/bear_lake

# Phase 0 research registry. Hylak_id identifies the lake polygon only; it is
# never substituted for a provider record ID or a SWOT Prior Lake Database ID.
profiles:
  - profile_id: great_salt
    Hylak_id: 67
    display_name: Great Salt
    state: UT
    role: Existing anchor; two-arm USGS level plus official topobathymetry
    legacy_preset_name: Great Salt Lake, UT
    potential_capability_ceiling: 5
    potential_source_quality_class: C
    key_constraints:
      - North- and south-arm level series are distinct and are not interchangeable.
      - Gauge elevations use NGVD29 while the official topobathymetry uses NAVD88.
      - Absolute storage remains blocked until datum and arm handling are resolved.
    swot:
      swot_pld_id: null
      hydrocron_status: requires_crosswalk
    sources:
      - source_id: usgs_great_salt_south_arm_level
        provider: usgs_waterdata
        priority: 10
        source_record_id: USGS-10010000
        source_item_id: null
        variable: water_level
        expected_unit: ft
        expected_vertical_datum: NGVD29
        expected_height_type: orthometric_height
        role: independent_south_arm_water_level
        required: true
        metadata:
          arm: south
          interchangeable_with_other_arm: false
          selection_status: discover_and_validate_series
      - source_id: usgs_great_salt_north_arm_level
        provider: usgs_waterdata
        priority: 20
        source_record_id: USGS-10010100
        source_item_id: null
        variable: water_level
        expected_unit: ft
        expected_vertical_datum: NGVD29
        expected_height_type: orthometric_height
        role: independent_north_arm_water_level
        required: true
        metadata:
          arm: north
          interchangeable_with_other_arm: false
          selection_status: discover_and_validate_series
    bathymetry_sources:
      - catalog_id: usgs_great_salt_topobathymetry
        provider: usgs_sciencebase
        priority: 10
        doi: 10.5066/P9DGG75W
        source_record_id: null
        product_type: topobathymetric_dem_and_elevation_area_volume
        source_quality_candidate: C
        metadata:
          landing_url: https://doi.org/10.5066/P9DGG75W
          verification_status: verify_landing_page_metadata

  - profile_id: lake_abert
    Hylak_id: 776
    display_name: Lake Abert
    state: OR
    role: Existing anchor; short NAVD88 USGS level record
    legacy_preset_name: Lake Abert, OR
    potential_capability_ceiling: 3
    potential_source_quality_class: E
    key_constraints:
      - No authoritative bathymetry or capacity relation is currently confirmed.
      - HydroLAKES modeled volume and depth cannot establish absolute storage.
    swot:
      swot_pld_id: null
      hydrocron_status: requires_crosswalk
    sources:
      - source_id: usgs_lake_abert_level
        provider: usgs_waterdata
        priority: 10
        source_record_id: USGS-10387150
        source_item_id: null
        variable: water_level
        expected_unit: ft
        expected_vertical_datum: NAVD88
        expected_height_type: orthometric_height
        role: lake_water_level
        required: true
        metadata:
          selection_status: discover_and_validate_series
    bathymetry_sources: []

  - profile_id: bear_lake
    Hylak_id: 778
    display_name: Bear Lake
    state: UT
    role: Natural lake with USGS level and official E-A-V/TBDEM
    legacy_preset_name: null
    potential_capability_ceiling: 5
    potential_source_quality_class: B
    key_constraints:
      - Phase 1 Class-B storage requires revalidation of both the USGS series and official E-A-V table on every run.
      - The USGS level series and E-A-V table are both NAVD88; any unknown or mismatched datum blocks derivation.
      - Derived area and storage are not observed values, and quantitative uncertainty is not yet available.
    swot:
      swot_pld_id: null
      hydrocron_status: requires_crosswalk
    sources:
      - source_id: usgs_bear_lake_level
        provider: usgs_waterdata
        priority: 10
        source_record_id: USGS-10055000
        source_item_id: null
        variable: water_level
        expected_unit: ft
        expected_vertical_datum: NAVD88
        expected_height_type: orthometric_height
        role: lake_water_level
        required: true
        metadata:
          selection_status: discover_and_validate_series
    bathymetry_sources:
      - catalog_id: usgs_bear_lake_eav_tbdem
        provider: usgs_sciencebase
        priority: 10
        doi: 10.5066/P14KZS2D
        source_record_id: null
        product_type: elevation_area_volume_and_topobathymetric_dem
        source_quality_candidate: B
        metadata:
          landing_url: https://doi.org/10.5066/P14KZS2D
          verification_status: verify_landing_page_metadata

  - profile_id: lake_powell
    Hylak_id: 802
    display_name: Lake Powell
    state: UT
    role: Reservoir with RISE operations and official E-A-capacity/TBDEM
    legacy_preset_name: null
    potential_capability_ceiling: 5
    potential_source_quality_class: B
    key_constraints:
      - RISE record 2362 and configured items 508, 509, and 4784 must be rediscovered and identity-validated on every run.
      - Validated agency total storage supports Level 4 directly; independent capacity-table recomputation remains blocked until the RISE elevation relationship to NAVD88 is documented.
    swot:
      swot_pld_id: null
      hydrocron_status: requires_crosswalk
    sources:
      - source_id: rise_lake_powell_item_inventory
        provider: usbr_rise
        priority: 10
        source_record_id: "2362"
        source_item_id: null
        variable: source_inventory
        expected_unit: null
        expected_vertical_datum: null
        expected_height_type: unknown
        role: discover_elevation_area_and_storage_items_without_guessing
        required: true
        metadata:
          selection_status: item_discovery_required
          storage_selection_rule: title_parameter_and_unit_must_clearly_match
      - source_id: rise_lake_powell_elevation
        provider: usbr_rise
        priority: 20
        source_record_id: "2362"
        source_item_id: "508"
        variable: reservoir_elevation
        expected_unit: ft
        expected_vertical_datum: null
        expected_height_type: project_datum_elevation
        role: daily_reservoir_elevation
        required: true
        metadata:
          expected_title_contains: Reservoir Elevation
          expected_update_frequency: daily
      - source_id: rise_lake_powell_total_storage
        provider: usbr_rise
        priority: 30
        source_record_id: "2362"
        source_item_id: "509"
        variable: storage
        expected_unit: acre-feet
        expected_vertical_datum: null
        expected_height_type: unknown
        role: daily_total_reservoir_storage
        required: true
        metadata:
          expected_title_contains: Storage
          expected_update_frequency: daily
          confers_absolute_storage_capability: true
      - source_id: rise_lake_powell_area
        provider: usbr_rise
        priority: 40
        source_record_id: "2362"
        source_item_id: "4784"
        variable: surface_area
        expected_unit: acres
        expected_vertical_datum: null
        expected_height_type: unknown
        role: daily_surface_area
        required: true
        metadata:
          expected_title_contains: Area
          expected_update_frequency: daily
    bathymetry_sources:
      - catalog_id: usgs_lake_powell_topobathymetry
        provider: usgs_sciencebase
        priority: 10
        doi: 10.5066/P9XX0J1Y
        source_record_id: null
        product_type: topobathymetric_dem
        source_quality_candidate: C
        metadata:
          landing_url: https://doi.org/10.5066/P9XX0J1Y
          verification_status: verify_landing_page_metadata
      - catalog_id: usgs_lake_powell_capacity_table
        provider: usgs_sciencebase
        priority: 20
        doi: 10.5066/P9O3IPG3
        source_record_id: null
        product_type: elevation_area_capacity_table
        source_quality_candidate: B
        metadata:
          landing_url: https://doi.org/10.5066/P9O3IPG3
          verification_status: verify_landing_page_metadata

  - profile_id: flaming_gorge
    Hylak_id: 784
    display_name: Flaming Gorge
    state: WY
    role: Reservoir with RISE elevation, area, bank-storage metadata, discoverable total storage, and ACAP survey
    legacy_preset_name: null
    potential_capability_ceiling: 4
    potential_source_quality_class: A
    key_constraints:
      - RISE item 4275 is bank storage, not total reservoir storage, and cannot by itself establish Level 4.
      - Configured total-storage item 337 must be rediscovered and identity-validated separately from bank storage on every run.
      - ACAP-derived storage remains a separate future validation path.
    swot:
      swot_pld_id: null
      hydrocron_status: requires_crosswalk
    sources:
      - source_id: rise_flaming_gorge_elevation
        provider: usbr_rise
        priority: 10
        source_record_id: "2300"
        source_item_id: "341"
        variable: reservoir_elevation
        expected_unit: ft
        expected_vertical_datum: null
        expected_height_type: project_datum_elevation
        role: daily_reservoir_elevation
        required: true
        metadata:
          expected_title_contains: Reservoir Elevation
          expected_update_frequency: daily
      - source_id: rise_flaming_gorge_bank_storage
        provider: usbr_rise
        priority: 20
        source_record_id: "2300"
        source_item_id: "4275"
        variable: bank_storage
        expected_unit: acre-feet
        expected_vertical_datum: null
        expected_height_type: unknown
        role: daily_bank_storage_not_total_storage
        required: true
        metadata:
          expected_title_contains: Bank Storage
          expected_update_frequency: daily
          confers_absolute_storage_capability: false
      - source_id: rise_flaming_gorge_area
        provider: usbr_rise
        priority: 30
        source_record_id: "2300"
        source_item_id: "4782"
        variable: surface_area
        expected_unit: acres
        expected_vertical_datum: null
        expected_height_type: unknown
        role: daily_surface_area
        required: true
        metadata:
          expected_title_contains: Area
          expected_update_frequency: daily
      - source_id: rise_flaming_gorge_total_storage
        provider: usbr_rise
        priority: 40
        source_record_id: "2300"
        source_item_id: "337"
        variable: storage
        expected_unit: acre-feet
        expected_vertical_datum: null
        expected_height_type: unknown
        role: daily_total_reservoir_storage
        required: true
        metadata:
          expected_title_contains: Storage
          expected_update_frequency: daily
          confers_absolute_storage_capability: true
    bathymetry_sources:
      - catalog_id: rise_flaming_gorge_sedimentation_survey
        provider: usbr_rise
        priority: 10
        doi: null
        source_record_id: "8065"
        product_type: sedimentation_survey_acap_metadata
        source_quality_candidate: B
        metadata:
          verification_status: metadata_only_no_file_download
